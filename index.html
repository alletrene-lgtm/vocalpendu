<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pendu Vocal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1a1a2e">
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --accent: #e94560;
    --accent2: #0f9b8e;
    --text: #f1f1f1;
    --muted: #9aa5b1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 100px;
  }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; text-align: center; }

  .word-display {
    font-size: 2.2rem;
    letter-spacing: 10px;
    font-weight: bold;
    margin: 16px 0;
    text-align: center;
    word-break: break-all;
  }

  .status {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 480px;
    margin: 12px 0;
    text-align: center;
  }
  .status .errors { font-size: 1.1rem; color: var(--accent); }
  .status .used-letters { margin-top: 8px; color: var(--muted); font-size: 0.95rem; }

  .mic-button {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--accent2);
    border: none;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    margin: 32px 0 16px;
    box-shadow: 0 0 0 0 rgba(15,155,142,0.5);
    transition: transform 0.15s ease;
  }
  .mic-button:active { transform: scale(0.95); }
  .mic-button.listening {
    background: var(--accent);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(233,69,96,0.6); }
    70% { box-shadow: 0 0 0 24px rgba(233,69,96,0); }
    100% { box-shadow: 0 0 0 0 rgba(233,69,96,0); }
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
  }
  button.secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2a3a5c;
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 1rem;
  }
  button.secondary:active { background: #223050; }

  .score-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 8px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .score-bar strong { color: var(--text); }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  .difficulty {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .difficulty button {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid #2a3a5c;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.9rem;
  }
  .difficulty button[aria-pressed="true"] {
    background: var(--accent2);
    color: white;
    border-color: var(--accent2);
  }

  #live-region {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
  }
</style>
</head>
<body>

<h1>Pendu Vocal</h1>
<p class="subtitle">Devinez le mot en disant une lettre à voix haute</p>

<div class="difficulty" role="group" aria-label="Choix de la difficulté">
  <button data-level="facile" aria-pressed="true">Facile</button>
  <button data-level="moyen" aria-pressed="false">Moyen</button>
  <button data-level="difficile" aria-pressed="false">Difficile</button>
</div>

<div class="score-bar">
  <span>Score : <strong id="score">0</strong></span>
  <span>Manches jouées : <strong id="rounds">0</strong></span>
</div>

<div class="word-display" id="word-display" aria-hidden="true">_ _ _ _</div>

<div class="status">
  <div class="errors" id="errors-count">Erreurs : 0 / 8</div>
  <div class="used-letters" id="used-letters">Lettres essayées : aucune</div>
</div>

<button class="mic-button" id="mic-btn">🎤 Dire une lettre</button>

<div class="controls">
  <button class="secondary" id="repeat-btn">🔊 Répéter le mot</button>
  <button class="secondary" id="new-word-btn">🔄 Nouveau mot</button>
</div>

<div id="live-region" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ---------- Banque de mots par difficulté (hors-ligne, aucune dépendance externe) ----------
  const WORD_BANKS = {
    facile: ["chat","vélo","table","porte","livre","pomme","route","maison","jardin","musique"],
    moyen: ["ordinateur","téléphone","montagne","voyage","biblioth","fenêtre","chocolat","escalier","fromage","kilomètre"],
    difficile: ["accessibilité","synthèse","reconnaissance","indépendance","navigateur","technologie","malvoyant","autonomie","perception","vocabulaire"]
  };
  // correction petite typo "biblioth" -> "bibliotheque" sans accent-issue
  WORD_BANKS.moyen[4] = "fenetre";
  WORD_BANKS.moyen[3] = "voyage";

  const MAX_ERRORS = 8;

  let state = {
    level: "facile",
    word: "",
    normalizedWord: "",
    guessed: new Set(),
    errors: 0,
    score: 0,
    rounds: 0,
    finished: false
  };

  const wordDisplay = document.getElementById("word-display");
  const errorsCount = document.getElementById("errors-count");
  const usedLetters = document.getElementById("used-letters");
  const micBtn = document.getElementById("mic-btn");
  const repeatBtn = document.getElementById("repeat-btn");
  const newWordBtn = document.getElementById("new-word-btn");
  const liveRegion = document.getElementById("live-region");
  const scoreEl = document.getElementById("score");
  const roundsEl = document.getElementById("rounds");
  const difficultyButtons = document.querySelectorAll(".difficulty button");

  // ---------- Normalisation (enlève les accents pour la comparaison) ----------
  function normalize(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  // ---------- Synthèse vocale ----------
  // IMPORTANT : sur Chrome/Android, un SpeechSynthesisUtterance non référencé
  // ailleurs qu'en variable locale peut être supprimé par le garbage collector
  // avant d'être prononcé -> voix silencieuse de façon aléatoire.
  // On garde donc une référence vivante dans utteranceQueue, et on ajoute un
  // court délai après cancel() car un speak() immédiat après cancel() est
  // parfois ignoré par le moteur (bug connu Chrome/Android).
  let utteranceQueue = [];

  function speak(text, onEnd) {
    window.speechSynthesis.cancel();
    utteranceQueue = [];
    liveRegion.textContent = text;
    setTimeout(function () {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "fr-FR";
      utter.rate = 0.95;
      utteranceQueue.push(utter);
      utter.onend = function () {
        utteranceQueue = utteranceQueue.filter(function (u) { return u !== utter; });
        if (onEnd) onEnd();
      };
      utter.onerror = function () {
        utteranceQueue = utteranceQueue.filter(function (u) { return u !== utter; });
      };
      window.speechSynthesis.speak(utter);
    }, 80);
  }

  // ---------- Ordinaux français pour annoncer la position d'une lettre ----------
  const ORDINALS = [
    "", "première", "deuxième", "troisième", "quatrième", "cinquième",
    "sixième", "septième", "huitième", "neuvième", "dixième",
    "onzième", "douzième", "treizième", "quatorzième", "quinzième",
    "seizième", "dix-septième", "dix-huitième", "dix-neuvième", "vingtième"
  ];
  function ordinal(n) {
    return ORDINALS[n] || (n + "ème");
  }
  function joinFrench(items) {
    if (items.length === 1) return items[0];
    return items.slice(0, -1).join(", ") + " et " + items[items.length - 1];
  }

  // ---------- Reconnaissance vocale ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  function initRecognition() {
    if (!SpeechRecognition) return null;
    const r = new SpeechRecognition();
    r.lang = "fr-FR";
    r.continuous = false;
    r.interimResults = false;
    r.maxAlternatives = 3;
    return r;
  }

  // Alphabet phonétique simplifié pour lever les ambiguïtés à l'oral
  const PHONETIC_MAP = {
    "a": "a", "as": "a", "ah": "a",
    "b": "b", "bé": "b", "be": "b",
    "c": "c", "cé": "c", "ce": "c", "se": "c",
    "d": "d", "dé": "d", "de": "d",
    "e": "e", "eu": "e",
    "f": "f", "effe": "f", "ef": "f",
    "g": "g", "gé": "g", "ge": "g",
    "h": "h", "ache": "h",
    "i": "i",
    "j": "j", "ji": "j",
    "k": "k", "ka": "k",
    "l": "l", "elle": "l", "el": "l",
    "m": "m", "aime": "m", "aimé": "m", "hème": "m",
    "n": "n", "aine": "n", "haine": "n",
    "o": "o", "au": "o", "eau": "o",
    "p": "p", "pé": "p", "pe": "p",
    "q": "q", "cu": "q", "queue": "q",
    "r": "r", "erre": "r", "air": "r",
    "s": "s", "esse": "s", "ès": "s",
    "t": "t", "té": "t", "the": "t",
    "u": "u",
    "v": "v", "vé": "v", "ve": "v",
    "w": "w", "double vé": "w",
    "x": "x", "ixe": "x",
    "y": "y", "i grec": "y", "igrec": "y",
    "z": "z", "zède": "z", "zed": "z"
  };

  function extractLetter(transcript) {
    const t = normalize(transcript.trim()).replace(/[.,!?;:]/g, "").trim();
    // Correspondance directe alphabet phonétique
    if (PHONETIC_MAP[t]) return PHONETIC_MAP[t];
    // Cherche une correspondance partielle (ex: "la lettre a")
    for (const key in PHONETIC_MAP) {
      if (t.includes(" " + key) || t === key || t.endsWith(" " + key)) return PHONETIC_MAP[key];
    }
    // Sinon prend la première lettre alphabétique reconnue
    const match = t.match(/[a-z]/);
    return match ? match[0] : null;
  }

  function startListening() {
    if (!SpeechRecognition) {
      speak("La reconnaissance vocale n'est pas disponible sur cet appareil.");
      return;
    }
    if (listening || state.finished) return;

    // On force explicitement la demande d'autorisation micro via getUserMedia
    // AVANT de démarrer SpeechRecognition. C'est plus fiable pour déclencher
    // la popup système que de laisser SpeechRecognition la déclencher seule
    // (notamment en PWA installée) : c'est ce qui explique que le site
    // n'apparaissait pas du tout dans la liste des autorisations micro.
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (stream) {
          // On n'a pas besoin du flux nous-mêmes, SpeechRecognition gère sa
          // propre capture ; on coupe donc immédiatement les pistes.
          stream.getTracks().forEach(function (track) { track.stop(); });
          reallyStartRecognition();
        })
        .catch(function (err) {
          if (err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError")) {
            speak("Le microphone a été refusé. Autorisez-le pour ce site dans les paramètres du navigateur, puis rechargez la page.");
          } else if (err && err.name === "NotFoundError") {
            speak("Aucun microphone détecté sur cet appareil.");
          } else {
            speak("Impossible d'accéder au microphone, réessayez.");
          }
        });
    } else {
      // Navigateur sans getUserMedia : on tente directement SpeechRecognition
      reallyStartRecognition();
    }
  }

  function reallyStartRecognition() {
    if (listening || state.finished) return;
    recognition = initRecognition();
    listening = true;
    let resultHandled = false; // évite le silence total si ni onresult ni onerror ne se déclenchent
    micBtn.classList.add("listening");
    micBtn.textContent = "🎤 J'écoute...";

    recognition.onresult = function (event) {
      resultHandled = true;
      const transcript = event.results[0][0].transcript;
      const letter = extractLetter(transcript);
      stopListening();
      if (letter) {
        handleGuess(letter);
      } else {
        // On répète ce qui a été entendu : utile pour comprendre pourquoi
        // ce n'est pas reconnu comme une lettre valide
        speak("J'ai entendu " + transcript + ", ce n'est pas une lettre valide. Réessayez.");
      }
    };

    recognition.onerror = function (event) {
      resultHandled = true;
      stopListening();
      const code = event && event.error;
      let message = "Erreur d'écoute, réessayez.";
      if (code === "not-allowed" || code === "service-not-allowed") {
        message = "Le microphone n'est pas autorisé pour ce site. Vérifiez les autorisations dans les paramètres du navigateur.";
      } else if (code === "no-speech") {
        message = "Je n'ai rien entendu. Réessayez en parlant juste après avoir appuyé sur le bouton.";
      } else if (code === "network") {
        message = "Problème de connexion internet. La reconnaissance vocale a besoin d'une connexion active.";
      } else if (code === "audio-capture") {
        message = "Aucun microphone détecté sur cet appareil.";
      }
      speak(message);
    };

    recognition.onend = function () {
      // Si ni onresult ni onerror ne se sont déclenchés, la session s'est
      // terminée en silence : c'est ce qui produisait l'impression que
      // "rien ne se passe". On l'annonce désormais explicitement.
      if (!resultHandled) {
        speak("Je n'ai rien capté. Vérifiez que le micro est autorisé et votre connexion internet, puis réessayez.");
      }
      stopListening();
    };

    try {
      recognition.start();
    } catch (e) {
      stopListening();
      speak("Impossible de démarrer l'écoute, réessayez.");
    }
  }

  function stopListening() {
    listening = false;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎤 Dire une lettre";
  }

  // ---------- Logique du jeu ----------
  function pickWord() {
    const bank = WORD_BANKS[state.level];
    const w = bank[Math.floor(Math.random() * bank.length)];
    return w;
  }

  function newRound(announce) {
    state.word = pickWord();
    state.normalizedWord = normalize(state.word);
    state.guessed = new Set();
    state.errors = 0;
    state.finished = false;
    render();
    if (announce !== false) {
      speak("Nouveau mot de " + state.word.length + " lettres. Dites une lettre pour commencer.", function () {
        // rien à faire après
      });
    }
  }

  function currentDisplay() {
    return state.normalizedWord
      .split("")
      .map(ch => (state.guessed.has(ch) ? state.word[state.normalizedWord.indexOf(ch)] || ch : "_"))
      .join(" ");
  }

  // Affichage lettre par lettre en respectant la casse/accents d'origine
  function displayWithOriginal() {
    let out = "";
    for (let i = 0; i < state.word.length; i++) {
      const normChar = state.normalizedWord[i];
      out += state.guessed.has(normChar) ? state.word[i] : "_";
      out += " ";
    }
    return out.trim();
  }

  function handleGuess(letter) {
    if (state.finished) return;
    letter = normalize(letter);
    if (state.guessed.has(letter)) {
      speak("Vous avez déjà essayé la lettre " + letter + ".");
      return;
    }
    state.guessed.add(letter);

    if (state.normalizedWord.includes(letter)) {
      render();
      if (isWordComplete()) {
        finishRound(true);
      } else {
        // Recense toutes les positions (1-based) où la lettre apparaît
        const positions = [];
        for (let i = 0; i < state.normalizedWord.length; i++) {
          if (state.normalizedWord[i] === letter) positions.push(i + 1);
        }
        const positionsText = joinFrench(positions.map(ordinal));
        const suffixe = positions.length > 1 ? "positions" : "position";
        speak("Oui, c'est bien la lettre " + letter + ", elle est en " + positionsText + " " + suffixe + ".");
      }
    } else {
      state.errors++;
      render();
      if (state.errors >= MAX_ERRORS) {
        finishRound(false);
      } else {
        speak("Non, pas celle-ci. Il vous reste " + (MAX_ERRORS - state.errors) + " erreurs possibles.");
      }
    }
  }

  function isWordComplete() {
    return state.normalizedWord.split("").every(ch => state.guessed.has(ch));
  }

  function finishRound(won) {
    state.finished = true;
    state.rounds++;
    if (won) {
      state.score += Math.max(10, (MAX_ERRORS - state.errors) * 10);
      speak("Bravo, le mot était " + state.word + ". Vous avez gagné cette manche. Dites nouveau mot, ou appuyez sur le bouton, pour continuer.");
    } else {
      speak("Perdu, le mot était " + state.word + ". Appuyez sur nouveau mot pour rejouer.");
    }
    render();
  }

  function render() {
    wordDisplay.textContent = displayWithOriginal();
    errorsCount.textContent = "Erreurs : " + state.errors + " / " + MAX_ERRORS;
    usedLetters.textContent = state.guessed.size
      ? "Lettres essayées : " + Array.from(state.guessed).sort().join(", ")
      : "Lettres essayées : aucune";
    scoreEl.textContent = state.score;
    roundsEl.textContent = state.rounds;
  }

  // ---------- Contrôles ----------
  micBtn.addEventListener("click", startListening);

  repeatBtn.addEventListener("click", function () {
    speak("Le mot a " + state.word.length + " lettres. " + displayWithOriginal().replace(/_/g, "lettre manquante"));
  });

  newWordBtn.addEventListener("click", function () {
    newRound();
  });

  difficultyButtons.forEach(btn => {
    btn.addEventListener("click", function () {
      difficultyButtons.forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      state.level = btn.dataset.level;
      speak("Difficulté " + btn.dataset.level + " sélectionnée.");
      newRound();
    });
  });

  // ---------- Initialisation ----------
  window.addEventListener("load", function () {
    newRound(false);
    speak("Bienvenue dans le Pendu Vocal. " + state.word.length + " lettres à deviner. Appuyez sur le bouton microphone pour dire une lettre.");
  });

  // ---------- PWA : enregistrement du service worker externe (sw.js) ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        // échec silencieux, l'app fonctionne quand même en ligne
      });
    });
  }
})();
</script>

</body>
</html>
